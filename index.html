<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Netflix-GT</title>
</head>

<body>
    <div class="contain_full">
        <div class="background">
            <header>
                <nav>
                    <div class="navbar">
                        <div class="logo">
                            <img src="./images/icons/Netflix_little.png" alt="">
                        </div>
                        <ul class="nav-links">
                            <li>Inicio</li>
                            <li>Series</li>
                            <li>Películas</li>
                        </ul>
                    </div>
                </nav>
            </header>
            <div class="info">
                <div class="contain">
                    <img src="./images/tittleMovie.png" alt="">
                    <p>¡Una emocionante aventura que explora el multiverso! Spider-Man se une a versiones alternativas
                        de sí mismo para enfrentar amenazas épicas.</p>
                    <div class="contain_btn">
                        <div class="principal_btn" id="play">
                            <img src="" alt="">
                            <a class="principal_btn" >Play</a>
                        </div>
                        <div class="principal_btn" id="info">
                            <img src="./images/info.png"  alt="">
                            <a class="principal_btn">Info</a>
                        </div>
    
                    </div>
                </div>
            </div>
        </div>
