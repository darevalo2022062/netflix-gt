<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/style-catalog.css">
    <title>Netflix-GT</title>
</head>

<body>
    <div class="contain_full">
        <div class="background">
            <header>
                <nav>
                    <div class="navbar">
                        <div class="logo">
                            <img src="./images/icons/Netflix_little.png" alt="">
                        </div>
                        <ul class="nav-links">
                            <li>Inicio</li>
                            <li>Series</li>
                            <li>Películas</li>
                        </ul>
                    </div>
                </nav>
            </header>
            <div class="info">
                <div class="contain">
                    <img src="./images/tittleMovie.png" alt="">
                    <ul>
                        <li>Animación</li>
                        <li>Superheroes</li>
                        <li>Aventura</li>
                    </ul>
                    <p>¡Una emocionante aventura que explora el multiverso! Spider-Man se une a versiones alternativas
                        de sí mismo para enfrentar amenazas épicas.</p>
                    <div class="contain_btn">
                        <div class="principal_btn" id="play">
                            <img src="./images/play-button-arrowhead.png" alt="">
                            <a>Play</a>
                        </div>
                        <div class="principal_btn" id="info">
                            <img src="./images/info.png" alt="">
                            <a>More Info</a>
                        </div>

                    </div>
                </div>
            </div>
            <div class="movies">
                <div class="title">
                    <h1>Lo mas visto por </h1>
                    <h1 id="gt-text">Guate</h1>
                    <div class="line"></div>
                </div>
                <div class="slide-container">
                    <img src="./images/covers/bob.png" alt="">
                    <img src="./images/covers/dragon.png" alt="">
                    <img src="./images/covers/spider-man.png" alt="">
                    <img src="./images/covers/santa.png" alt="">
                </div>

                <div class="title">
                    <h1>Series de Anime</h1>
                    <div class="line"></div>
                </div>
                <div class="slide-container">
                    <img src="./images/covers/bob.png" alt="">
                    <img src="./images/covers/dragon.png" alt="">
                    <img src="./images/covers/spider-man.png" alt="">
                    <img src="./images/covers/santa.png" alt="">
                </div>

                <div class="catalog">
                    <div class="item-container">
                        <img src="./images/covers/matrix.png" alt="">
                    </div>
                    <div class="item-container">
                        <img src="./images/covers/john.png" alt="">
                    </div>
                    <div class="item-container">
                        <img src="./images/covers/rosario tijeras.jpg" alt="">
                    </div>
                    <div class="item-container">
                        <img src="./images/covers/john.png" alt="">
                    </div>
                    
                </div>
            </div>
        </div>
        
    </div>

</body>

</html>
